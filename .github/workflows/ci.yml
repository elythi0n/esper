name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full build and test suite on every platform Esper targets. All three
  # are real targets, so all three are tested from the first commit rather than
  # bolted on when the port happens.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # openh264 compiles Cisco's C, and its x86 assembly needs nasm. Without
      # it the upstream build script silently falls back to a C-only path,
      # measured at 2.5% to 6% slower with identical output size.
      #
      # Installed here so CI measures what users with an assembler get, and so
      # the build's warning does not appear on every run. The encode crate
      # warns rather than failing, so this is convenience rather than a gate.
      - name: Install nasm (openh264 assembly)
        uses: ilammy/setup-nasm@v1

      - name: Rust — format
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Rust — clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The X11 capture backend is only exercised if there is an X server to
      # exercise it against, and a CI runner has none. Xvfb provides one with
      # DAMAGE, MIT-SHM, XFIXES and RandR, which is the whole fast path — so
      # the live tests run here rather than skipping, and the region damage
      # path is tested deterministically because nothing else on an Xvfb
      # display moves.
      #
      # Linux only: this is where the X11 backend is compiled in at all. On
      # macOS and Windows DISPLAY stays unset and those tests skip themselves.
      - name: Start Xvfb (X11 capture tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils
          # `-noreset` is not optional. An X server without it **resets when
          # its last client disconnects** — every resource destroyed and every
          # connection closed — and this suite is a stream of short-lived
          # clients across parallel tests. Whenever the count reaches zero at
          # the wrong moment, a connection being established at that instant
          # dies with ECONNRESET. Measured on this suite: 2 runs in 8 failed
          # without it, 0 in 8 with a client held open throughout. A real
          # desktop always has a window manager attached, which is why nothing
          # outside CI sees this.
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp -noreset &
          for _ in $(seq 1 50); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          # Fail loudly if the extensions the backend needs are missing, rather
          # than letting the tests quietly take their fallback paths.
          DISPLAY=:99 xdpyinfo | grep -q MIT-SHM
          DISPLAY=:99 xdpyinfo | grep -q DAMAGE
          DISPLAY=:99 xdpyinfo | grep -q XFIXES
          DISPLAY=:99 xdpyinfo | grep -q RANDR
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Tests that disturb a display — injecting keys, taking the focus,
          # drawing a frame over the whole screen — are off unless asked for.
          # A suite that did that to somebody's desktop whenever they ran it is
          # a suite they turn off. Here the display is an Xvfb nobody is
          # looking at, so they run.
          echo "ESPER_DISPLAY_TESTS=1" >> "$GITHUB_ENV"

      # The mDNS wire format is checked against `dnspython`, an independent
      # implementation of the same documents — because a format tested only
      # against its own reader is tested against its own misunderstandings.
      # Those tests skip when it is absent and say so, so this is what makes
      # them actually run.
      - name: Install dnspython (mDNS interoperability tests)
        run: python3 -m pip install --break-system-packages dnspython

      - name: Rust — test
        working-directory: core
        run: cargo test --workspace

      # Every performance target the design states, measured here.
      #
      # **Most of the figures are not comparable to the recorded baseline**,
      # because a runner is a different machine and an encode time is a
      # property of a processor. Those are reported so drift is visible in the
      # log. The two that *are* portable — a ratio of two timings on one
      # machine, and a figure the gate's policy decides rather than the
      # hardware — are gated here as everywhere, and a regression in one fails
      # this job.
      - name: Rust — benchmark against the targets
        run: make bench

      - name: Go — format
        shell: bash
        run: test -z "$(gofmt -s -l . | tee /dev/stderr)"

      - name: Go — vet
        run: go vet ./...

      - name: Go — test
        run: go test ./...

      # The cross-language contract. Both implementations decode the same
      # committed fixtures and must re-encode them byte-identically; the reason
      # codes are parsed out of the Rust source and compared to Go's. Two
      # independent implementations of one protocol drift silently, and this is
      # the mechanism that stops it.
      - name: Cross-language wire compatibility
        run: go test ./internal/proto/ -run 'Fixture|Wire|FieldOrder|ReasonCodesMatchRust' -v

  # Race detector and coverage, Linux only — it is slow and platform-independent.
  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -cover ./...

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # Licences, advisories, banned crates and unknown sources. A malicious
  # dependency reaches everything silently, so this gates every change.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml

  # Every dependency is either audited by us or covered by a published audit
  # set we trust. The exemptions are the tree we inherited on day one plus what
  # each phase added; they shrink as they are reviewed, and a new dependency
  # cannot be added silently. `cargo vet check` prints the current counts —
  # naming one here only guarantees a stale comment.
  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install cargo-vet --locked
      - name: vet
        working-directory: core
        run: cargo vet check

  # This repository must be self-contained: it is developed inside a planning
  # tree that is never published, and a public repo linking into a private
  # folder is a broken link at best.
  isolation:
    name: repository is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-isolation.sh

  # A `pub` item in a library crate is never dead code, so `dead_code` cannot
  # see a security type that nothing calls -- and three of those shipped in one
  # week. This is the check that covers the blind spot; the ledger inside it is
  # where a name with no producer has to say why.
  reached:
    name: every declared name is reached
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ./scripts/check-reached.py

  # Both halves are built by different toolchains from one VERSION file. If they
  # disagree about the release or the protocol, the seam is broken in a way no
  # unit test catches — each half passes its own suite.
  smoke:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - run: ./scripts/smoke.sh

  # Memory-safety checks over the fast crates. esper-crypto is excluded here
  # and covered by the nightly workflow: interpreting Ed25519 costs ~200s
  # against ~13s for everything else, and dalek's unsafe is audited upstream.
  # The FFI crates land in Phase 3 and belong in *this* set, because that is
  # where undefined behavior actually lives.
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: miri test
        working-directory: core
        run: cargo miri test --workspace --exclude esper-crypto

  # The frame decoder is the first parser attacker-controlled bytes reach. A
  # short run on every change catches a regression; long runs happen out of band.
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # openh264 compiles Cisco's C and needs nasm for its assembly; without
      # it the encode crate's build script refuses to build at all, and the
      # decoder target is in this set.
      - uses: ilammy/setup-nasm@v1
      - run: cargo install cargo-fuzz --locked
      # Every parser that touches untrusted input gets a target. A short run on
      # each change catches a regression; the nightly workflow runs them long.
      #
      # `make fuzz` owns the list, as `make fuzz-targets` says it does. This
      # job used to name three targets of its own, so six parsers — the control
      # framing, damage coalescing, the decoder, media packets, mDNS and the
      # broker's meet — were fuzzed nightly and not on the change that broke
      # them. A list in two places is a list that disagrees with itself.
      - name: fuzz each target, 30s
        run: make fuzz FUZZ_SECONDS=30
