name: Nightly

# The checks that are too slow to run on every push but too valuable to skip.
# A regression here is found within a day rather than at release.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full MIRI run, including esper-crypto — ~200s of interpreting Ed25519
  # that is not worth a per-push wait but is worth knowing about daily.
  miri-full:
    name: miri (all crates)
    runs-on: ubuntu-latest
    # Under GitHub's six hours, so a run that is too slow fails with its own
    # name instead of being cancelled.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # `make miri-full` rather than the cargo command, so the crate
      # exclusions live in one place. esper-encode cannot run under MIRI at
      # all — MIRI cannot call into C — and duplicating that here would mean
      # remembering it twice.
      - run: make miri-full

  # A long fuzz run. The 60s smoke run on each push catches regressions; this is
  # the one that finds something new.
  fuzz-long:
    name: fuzz (10 min per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # openh264 compiles Cisco's C and needs nasm for its assembly; without
      # it the encode crate's build script refuses to build at all.
      - uses: ilammy/setup-nasm@v1
      - run: cargo install cargo-fuzz --locked
      # Seed the decoder's corpus from the encoder's own output before
      # fuzzing. A fuzzer starting from random bytes spends its budget
      # learning that H.264 begins with a parameter set, and everything
      # interesting is behind that gate. Measured: 628 coverage points
      # unseeded against 1759 seeded, in a fifth of the time.
      - name: Seed the decoder corpus
        run: make fuzz-corpus
      # `make fuzz` owns the target list and the C compiler flags. This job
      # used to keep its own copy of the list, which is how two targets ended
      # up fuzzed for 30 seconds on every push and never for the ten minutes
      # that actually finds something.
      #
      # It also needs clang: `cargo fuzz` sets RUSTFLAGS and not CFLAGS, so
      # openh264's C would be built with neither sanitiser nor coverage
      # instrumentation, and the decoder target would be fuzzing our own
      # bounds checks rather than the parser behind them. gcc rejects the
      # coverage flags outright. ubuntu-latest ships clang.
      - name: ten minutes per target
        run: make fuzz FUZZ_SECONDS=600
      - name: Upload any crash found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: core/fuzz/artifacts/

  # Advisories are published continuously, so a tree that was clean yesterday
  # may not be today. This is the check that notices without a code change.
  # The gates that need a browser, which is why they are here and not in CI.
  #
  # Eight of the window's checks drive a real engine: the accessibility tree,
  # the focus order, the words, the layout at four widths in three themes, the
  # painted contrast, the frame timings. They are minutes rather than seconds
  # and they need Chromium and a framebuffer, so they run nightly — but they
  # ran *nowhere* before this, which is worse than slow.
  #
  # Against a fixed machine, not this runner's: `gate-rig.sh` serves a device
  # store built for the screens, because a gate pointed at an empty control
  # plane measures the same placeholder on every route and says nothing.
  window-gates:
    name: the window, in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: a browser and a framebuffer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser xvfb || \
            sudo apt-get install -y -qq chromium xvfb
      - name: install exactly what the lockfile says
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: build the control plane the gates read
        run: make build-go
      - name: every gate, against a machine that is the same on every machine
        run: xvfb-run -a make check-screens

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check advisories
