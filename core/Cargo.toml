[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz", "spikes/handshake"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
esper-proto = { path = "crates/esper-proto" }
esper-media = { path = "crates/esper-media" }
esper-crypto = { path = "crates/esper-crypto" }
esper-transport = { path = "crates/esper-transport" }
esper-rendezvous = { path = "crates/esper-rendezvous" }
esper-pty = { path = "crates/esper-pty" }
esper-audit = { path = "crates/esper-audit" }
esper-buildinfo = { path = "crates/esper-buildinfo" }
esper-capture = { path = "crates/esper-capture" }
esper-capture-x11 = { path = "crates/esper-capture-x11" }
esper-color = { path = "crates/esper-color" }
esper-encode = { path = "crates/esper-encode" }
esper-decode = { path = "crates/esper-decode" }
esper-scale = { path = "crates/esper-scale" }
esper-present = { path = "crates/esper-present" }
esper-present-x11 = { path = "crates/esper-present-x11" }
esper-pipeline = { path = "crates/esper-pipeline" }
esper-stream = { path = "crates/esper-stream" }
esper-link = { path = "crates/esper-link" }
esper-discovery = { path = "crates/esper-discovery" }
esper-input = { path = "crates/esper-input" }
esper-input-x11 = { path = "crates/esper-input-x11" }
esper-presence = { path = "crates/esper-presence" }
esper-presence-x11 = { path = "crates/esper-presence-x11" }
# Test-only: see the crate's own documentation.
esper-display-lock = { path = "crates/esper-display-lock" }
# Pure Rust: it speaks the X11 protocol over a socket rather than binding
# libX11, so nothing here links a display library and this crate keeps
# `forbid(unsafe_code)`. That also keeps the smoke test's "the engine links no
# display library" check true, which is worth more than it sounds — it is what
# stops a headless server growing a dependency on a desktop being installed.
x11rb = { version = "0.14", default-features = false, features = [
    "randr",
    "damage",
    "shm",
    "xfixes",
    # Injection. XTEST is the X server's own test extension and the only way to
    # synthesise input that applications cannot tell from a real device — which
    # is the point: a remote desktop whose keystrokes were ignored by anything
    # that checks would be a remote desktop that does not work.
    "xtest",
    # The session indicator's frame has to be *visible* without being
    # *clickable*: without an empty input shape, four windows around the edge
    # of the screen would swallow every click on the edge of the screen.
    "shape",
    # The remote pointer becomes the viewer window's own cursor, which is what
    # makes it cost nothing: the server draws it at the local pointer, so it
    # moves at the speed of the hand rather than at the speed of the link. An
    # ARGB cursor with an alpha channel needs RENDER; the core protocol's
    # cursors are two-colour.
    "render",
] }
# Already in the tree through quinn, and already vetted, so this costs nothing
# new. Wanted for `SO_REUSEPORT` — without it an mDNS responder cannot start on
# any desktop where a browser or `avahi-daemon` already holds port 5353 — and
# for multicast group joins and TTL.
socket2 = "0.6"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A panic reachable from the network is a denial of service. These are the
# panicking constructs that matter; see docs on the engine's error policy.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Deliberately NOT enabled: clippy::integer_division. It fires on every
# legitimate integer `/` — bitrate math, frame timing, buffer sizing, calendar
# arithmetic — so it would live permanently behind `allow`, and a lint that is
# always allowed teaches you to allow lints. Truncation risk is covered by
# release overflow checks and by reviewing the arithmetic that matters.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

# Overflow checks stay ON in release: arithmetic on attacker-influenced values
# must trap rather than wrap. The cost is a branch; the alternative is a class
# of silent bugs in a security product.
[profile.release]
overflow-checks = true
debug = 1

# The profile releases are built with. Optimised for size and startup, because
# the engine is scp'd onto servers and run from a systemd unit.
#
# `panic = "abort"` is deliberately **not** set, despite being the single
# biggest size win available. The controller puts the user's terminal into raw
# mode and restores it in `Drop`; with `abort` that never runs, leaving a shell
# that does not echo and a user who cannot see what they are typing to fix it.
# `esper-pty`'s panic hook does cover that case, but relying on one mechanism
# where two exist is a poor trade for a few hundred kilobytes.
[profile.dist]
inherits = "release"
# Overflow checks stay on. Arithmetic on attacker-influenced values must trap
# rather than wrap, and that is not a debug-build nicety.
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"
# No `opt-level = "z"`: the media pipeline arriving in Phase 3 is
# latency-critical, and trading its speed for binary size would be optimising
# the wrong number.
panic = "unwind"
