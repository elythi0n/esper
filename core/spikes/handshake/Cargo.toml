[workspace]

[package]
name = "handshake-spike"
version = "0.0.0"
edition = "2024"
publish = false

# A spike, not shipped code. It measures whether hybrid post-quantum key
# agreement engages over QUIC, and is deleted once that is settled.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"

[dependencies]
quinn = "0.11"
# prefer-post-quantum is a rustls default, but it is named explicitly here so a
# `default-features = false` anywhere in the tree cannot silently demote the
# hybrid group to last place and hand us a classical handshake.
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "prefer-post-quantum",
    "std",
    "logging",
] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ed25519-dalek = "3"
getrandom = "0.4"
rcgen = "0.13"
