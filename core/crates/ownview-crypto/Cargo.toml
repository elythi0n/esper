[package]
name = "ownview-crypto"
description = "Device identity, fingerprints, pairing and the session handshake. The only crate permitted to import a cryptography library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ownview-proto.workspace = true
# No `pkcs8` feature: it pulls in der, pkcs8, spki and base64ct — a
# general-purpose ASN.1 parser in the handshake path — to produce two
# fixed-length encodings. See src/der.rs.
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
rand_core = "0.10"
getrandom = "0.4"
sha2 = "0.11"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex = "0.4"
serde_json = "1"
