[package]
name = "ownview-capture-x11"
description = "Screen capture on X11: RandR for monitors, XDamage for what changed, MIT-SHM for the pixels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ownview-capture.workspace = true
thiserror.workspace = true
tracing.workspace = true
x11rb = { workspace = true }

# Declared here rather than at the workspace root, the way ownview-pipeline
# does: `event` is for waiting on the X connection with a deadline, and `fs`
# and `mm` are for the shared memory segment.
[dev-dependencies]
x11rb = { workspace = true }
ownview-capture = { workspace = true, features = [] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs", "mm"] }
