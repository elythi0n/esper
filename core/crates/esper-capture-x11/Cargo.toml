[package]
name = "esper-capture-x11"
description = "Screen capture on X11: RandR for monitors, XDamage for what changed, MIT-SHM for the pixels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
esper-desktop.workspace = true
esper-capture.workspace = true
thiserror.workspace = true
tracing.workspace = true
x11rb = { workspace = true }

[dev-dependencies]
esper-display-lock.workspace = true
x11rb = { workspace = true }
esper-capture = { workspace = true, features = [] }

# Declared here rather than at the workspace root, the way esper-pipeline
# does: `event` is for waiting on the X connection with a deadline, and `fs`
# and `mm` are for the shared memory segment. Gated on the same target as the
# crate itself, so the manifest and the code agree about where this builds.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["event", "fs", "mm"] }
