[package]
name = "esper-media"
description = "Media on the wire: RTP packetization of H.264 for QUIC datagrams, and reassembly that abandons a frame rather than waiting for it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

# Test-only, for the round trip through the real codec. The crate itself knows
# nothing about H.264 beyond its NAL unit headers, and must not: packetizing is
# framing, and a dependency on an encoder would make it a codec concern.
[dev-dependencies]
esper-capture.workspace = true
esper-color.workspace = true
esper-encode.workspace = true
esper-decode.workspace = true
