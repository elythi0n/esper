[package]
name = "ownview-encode"
description = "Software H.264 encoding, and the CPU budget that keeps it from taking the host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dev-dependencies]
# The screen-content comparison measures against openh264's own default, so it
# has to reach the wrapper directly rather than through this crate's opinions.
openh264 = { version = "0.9", default-features = false, features = ["source"] }

[dependencies]
ownview-capture.workspace = true
ownview-color.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The only video encoder in v1. BSD-2-Clause, built from Cisco's source rather
# than downloading their prebuilt binary — which would be a runtime download
# from a third party in a product whose whole premise is that it contacts
# nobody.
#
# `default-features = false` then `source`: the default pulls the `libloading`
# path, which finds a shared library at run time. That is a plugin mechanism,
# and a plugin mechanism is somewhere an attacker can put a library.
openh264 = { version = "0.9", default-features = false, features = ["source"] }
