[package]
name = "esper-capture-win"
description = "Capturing a Windows desktop through DXGI Desktop Duplication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# **Deliberately not `lints.workspace = true`**, and the second of two crates
# that are not. See `esper-input-win`'s manifest for the argument, and
# `scripts/check-unsafe-inventory.py` for what makes it safe: these tables are
# compared to the workspace's in both directions, `unsafe` may appear nowhere
# else, and every block must be answered by one inventory entry.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
esper-capture.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Only on Windows, so a Linux build neither compiles nor downloads it. The
# feature list is the smallest that names what this calls.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  # `DXGI_OUTPUT_DESC` carries an `HMONITOR`, so it needs this even though
  # nothing here calls a GDI function.
  "Win32_Graphics_Gdi",
] }
