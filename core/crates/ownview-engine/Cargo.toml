[package]
name = "ownview-engine"
description = "The OwnView engine: capture, encode, transport, decode, present, input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ownview-pipeline.workspace = true
ownview-scale.workspace = true
ownview-present.workspace = true
ownview-capture.workspace = true
ownview-color.workspace = true
ownview-encode.workspace = true
ownview-decode.workspace = true
ownview-proto.workspace = true
ownview-crypto.workspace = true
ownview-transport.workspace = true
ownview-link.workspace = true
ownview-media.workspace = true
ownview-stream.workspace = true
tokio.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
ownview-buildinfo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# X11 capture is a Linux backend and a Linux dependency. The engine builds on
# Windows and macOS without it, which is the point of keeping backends in
# their own crates.
[target.'cfg(target_os = "linux")'.dependencies]
ownview-capture-x11.workspace = true
ownview-present-x11.workspace = true
