[package]
name = "esper-engine"
description = "The Esper engine: capture, encode, transport, decode, present, input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
esper-clock.workspace = true
esper-audio-pulse.workspace = true
esper-audio.workspace = true
esper-pipeline.workspace = true
esper-scale.workspace = true
esper-present.workspace = true
esper-capture.workspace = true
esper-color.workspace = true
esper-encode.workspace = true
esper-decode.workspace = true
esper-proto.workspace = true
esper-crypto.workspace = true
esper-transport.workspace = true
esper-rendezvous.workspace = true
esper-config.workspace = true
esper-link.workspace = true
esper-media.workspace = true
esper-stream.workspace = true
esper-discovery.workspace = true
esper-interfaces.workspace = true
esper-input.workspace = true
esper-clipboard.workspace = true
esper-files.workspace = true
esper-keeper.workspace = true
esper-mkv.workspace = true
esper-presence.workspace = true
esper-dialog.workspace = true
esper-png.workspace = true
esper-pty.workspace = true
esper-audit.workspace = true
# Thirty-two random bytes for an invitation's token, and nothing else. Already
# in the tree through the transport, which wants the same thing for a session
# identifier.
getrandom = "0.2"
# `io-std` for the controller's own terminal: everything else the engine does
# with tokio is sockets and timers, and standard output is only in the path
# when this process *is* somebody's terminal.
tokio = { workspace = true, features = ["io-std"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
esper-buildinfo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# X11 capture is a Linux backend and a Linux dependency. The engine builds on
# Windows and macOS without it, which is the point of keeping backends in
# their own crates.
# **A test that plays the desktop's part.** `backdrop_keeper.rs` paints a
# wallpaper, publishes it and holds it — which needs an X connection of its
# own, because no tool on a bare machine leaves a background pixmap behind.
# Both are already in this workspace; neither reaches the shipped binary.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb.workspace = true
esper-display-lock.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
esper-capture-win.workspace = true
esper-input-win.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
esper-capture-wlr.workspace = true
esper-capture-x11.workspace = true
esper-present-x11.workspace = true
esper-input-wlr.workspace = true
esper-input-x11.workspace = true
esper-clipboard-x11.workspace = true
esper-presence-wlr.workspace = true
esper-presence-x11.workspace = true
esper-ask-x11.workspace = true
