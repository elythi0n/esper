[package]
name = "esper-engine"
description = "The Esper engine: capture, encode, transport, decode, present, input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
esper-pipeline.workspace = true
esper-scale.workspace = true
esper-present.workspace = true
esper-capture.workspace = true
esper-color.workspace = true
esper-encode.workspace = true
esper-decode.workspace = true
esper-proto.workspace = true
esper-crypto.workspace = true
esper-transport.workspace = true
esper-link.workspace = true
esper-media.workspace = true
esper-stream.workspace = true
esper-discovery.workspace = true
esper-input.workspace = true
esper-presence.workspace = true
tokio.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
esper-buildinfo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# X11 capture is a Linux backend and a Linux dependency. The engine builds on
# Windows and macOS without it, which is the point of keeping backends in
# their own crates.
[target.'cfg(target_os = "linux")'.dependencies]
esper-capture-x11.workspace = true
esper-present-x11.workspace = true
esper-input-x11.workspace = true
esper-presence-x11.workspace = true
