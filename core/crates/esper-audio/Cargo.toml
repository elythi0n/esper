[package]
name = "esper-audio"
description = "Sound: the capture abstraction, Opus encode and decode, and a synthetic source for testing without a sound card."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
esper-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true

# libopus, built from vendored source the way `openh264` is — so a release
# binary carries its own codec and does not depend on what a distribution
# happens to ship. See this crate's `opus` module for why Opus and nothing
# else, and `supply-chain/config.toml` for the exemption.
opus = "0.4"
