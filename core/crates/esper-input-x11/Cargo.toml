[package]
name = "esper-input-x11"
description = "Injecting input through X11's XTEST extension, in pure Rust over a socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
esper-input.workspace = true
# The undo vocabulary, because a floating device is server state that outlives
# this process and may not be created without something that can restore it.
esper-keeper.workspace = true
esper-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
# XInput2, for detaching this machine's own keyboard and pointer from their
# master while a session runs — the other half of the privacy screen. See the
# `floating` module for what that does and does not claim.
x11rb = { workspace = true, features = ["xinput"] }

[dev-dependencies]
esper-display-lock.workspace = true
