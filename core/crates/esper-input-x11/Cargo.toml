[package]
name = "esper-input-x11"
description = "Injecting input through X11's XTEST extension, in pure Rust over a socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
esper-input.workspace = true
esper-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
x11rb.workspace = true

[dev-dependencies]
esper-display-lock.workspace = true
# XInput2, for the one test that measures why local input is *not* blocked
# during a session. A dev-dependency rather than a workspace feature: the
# production binaries have no use for it, and the measurement it guards is the
# reason a feature was not built.
x11rb = { workspace = true, features = ["xinput"] }
