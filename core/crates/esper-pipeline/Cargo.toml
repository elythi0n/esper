[package]
name = "esper-pipeline"
description = "The media path as one thing: capture, damage, convert, encode, and the timing that makes it measurable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
esper-capture.workspace = true
esper-color.workspace = true
esper-scale.workspace = true
esper-encode.workspace = true
esper-decode.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
esper-color.workspace = true
esper-encode.workspace = true
esper-scale.workspace = true

[target.'cfg(unix)'.dependencies]
# For CLOCK_PROCESS_CPUTIME_ID. Wall-clock time and CPU time diverge the moment
# anything is threaded, and the budget is written in CPU time — measuring the
# wrong one reported a threaded encoder as three times cheaper than it was.
rustix = { version = "1", features = ["time"] }
