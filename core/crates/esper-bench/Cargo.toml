[package]
name = "esper-bench"
description = "Every performance target this project states, measured on the machine in front of you, against a baseline that fails the build when it moves the wrong way."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
esper-capture.workspace = true
esper-color.workspace = true
esper-encode.workspace = true
esper-pipeline.workspace = true
esper-scale.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# Process CPU time, the same clock the pipeline's own stage timers read. Already
# in the tree; a direct name for something vendored rather than a new crate.
rustix = { version = "1", features = ["time"] }
