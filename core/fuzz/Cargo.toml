[workspace]

[package]
name = "esper-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
esper-proto = { path = "../crates/esper-proto" }
esper-transport = { path = "../crates/esper-transport" }
esper-capture = { path = "../crates/esper-capture" }
esper-decode = { path = "../crates/esper-decode" }
esper-media = { path = "../crates/esper-media" }
esper-discovery = { path = "../crates/esper-discovery" }
esper-rendezvous = { path = "../crates/esper-rendezvous" }
ciborium = "0.2"

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay"
path = "fuzz_targets/replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_frames"
path = "fuzz_targets/control_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "damage_coalesce"
path = "fuzz_targets/damage_coalesce.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_bitstream"
path = "fuzz_targets/decode_bitstream.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[[bin]]
name = "media_packets"
path = "fuzz_targets/media_packets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mdns_packets"
path = "fuzz_targets/mdns_packets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rendezvous_meet"
path = "fuzz_targets/rendezvous_meet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "forward_allow"
path = "fuzz_targets/forward_allow.rs"
test = false
doc = false
bench = false
